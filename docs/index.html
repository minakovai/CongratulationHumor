<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Генератор поздравлений</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: linear-gradient(135deg, #fee2e2, #dbeafe 60%, #dcfce7); min-height: 100vh; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; padding: 36px 20px 56px; }
    .card { background: rgba(255,255,255,0.9); border-radius: 18px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; font-size: 2rem; }
    .holiday { font-size: 1.25rem; background: #eef2ff; border-left: 5px solid #6366f1; border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; }
    textarea { width: 100%; min-height: 120px; border-radius: 12px; border: 1px solid #cbd5e1; padding: 12px; font-size: 1rem; resize: vertical; box-sizing: border-box; }
    button { margin-top: 12px; background: #4f46e5; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 10px; cursor: pointer; }
    button:hover { background: #4338ca; }
    .results { margin-top: 28px; display: grid; gap: 14px; }
    .greeting { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 14px; line-height: 1.45; white-space: pre-line; }
    .name { font-weight: 700; margin-bottom: 8px; }
    .hint { color: #475569; margin-bottom: 8px; }
    .error { color: #991b1b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🎉 Генератор душевных поздравлений</h1>
      <div class="holiday" id="holiday"></div>

      <p class="hint">Введите имена друзей (каждое с новой строки или через запятую):</p>
      <textarea id="names" placeholder="Например:
Алексей
Марина
Игорь"></textarea>
      <br />
      <button id="generate">Сгенерировать поздравления</button>

      <div id="error" class="error" hidden></div>
      <div id="results" class="results"></div>
    </div>
  </div>

  <script>
    const FIXED_HOLIDAYS = {
      '01-01': 'Новый год',
      '01-07': 'Рождество Христово',
      '02-14': 'День всех влюблённых',
      '02-23': 'День защитника Отечества',
      '03-08': 'Международный женский день',
      '04-12': 'День космонавтики',
      '05-01': 'Праздник Весны и Труда',
      '05-09': 'День Победы',
      '06-12': 'День России',
      '07-08': 'День семьи, любви и верности',
      '09-01': 'День знаний',
      '10-05': 'День учителя',
      '11-04': 'День народного единства',
      '12-31': 'Канун Нового года'
    };

    const openings = [
      '%s, с праздником тебя сердечно поздравляю!',
      '%s, сегодня %s — от души тебя обнимаю!',
      '%s, в этот %s тебе я радость посылаю!'
    ];
    const wishes = [
      'Пусть всё, за что берёшься, получается легко,\nа рядом будут близкие, надёжно и тепло.',
      'Пусть вдохновение не тает, как звезда на высоте,\nи каждый новый день сияет удачей в доброте.',
      'Пусть дом наполнит смех и свет, в делах всегда успех,\nа сердце бережёт мечту и самый звонкий смех.'
    ];
    const rhymes = [
      'Пусть будет жизнь, как яркий май:\nмечтай, твори и побеждай!',
      'Пускай ведёт тебя звезда,\nи будет радость навсегда!',
      'Пусть счастье льётся через край,\nживи красиво, расцветай!'
    ];

    function nthWeekdayOfMonth(year, month, weekdayIso, nth) {
      const date = new Date(year, month - 1, 1);
      while (((date.getDay() + 6) % 7) + 1 !== weekdayIso) date.setDate(date.getDate() + 1);
      date.setDate(date.getDate() + (nth - 1) * 7);
      return date;
    }

    function formatDateKey(date) {
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${m}-${d}`;
    }

    function fullDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getHoliday(today) {
      const fixed = FIXED_HOLIDAYS[formatDateKey(today)];
      if (fixed) return fixed;
      const y = today.getFullYear();
      const dynamic = {
        [fullDateKey(nthWeekdayOfMonth(y, 8, 7, 2))]: 'День строителя',
        [fullDateKey(nthWeekdayOfMonth(y, 10, 7, 1))]: 'День учителя (праздничное воскресенье)',
        [fullDateKey(nthWeekdayOfMonth(y, 11, 7, 4))]: 'День матери'
      };
      return dynamic[fullDateKey(today)] || 'День тёплых слов';
    }

    function normalizeName(name) {
      const trimmed = name.trim().replace(/\s+/gu, ' ');
      if (!trimmed) return '';
      return trimmed[0].toUpperCase() + trimmed.slice(1).toLowerCase();
    }

    function randomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function greetingFor(name, holiday) {
      const openingTemplate = randomItem(openings);
      const opening = openingTemplate.replace('%s', name).replace('%s', holiday.toLowerCase());
      return `${opening}\n${randomItem(wishes)}\n${randomItem(rhymes)}`;
    }

    const today = new Date();
    const holiday = getHoliday(today);
    document.getElementById('holiday').textContent = `Сегодня: ${holiday} (${today.toLocaleDateString('ru-RU')})`;

    document.getElementById('generate').addEventListener('click', () => {
      const input = document.getElementById('names').value;
      const results = document.getElementById('results');
      const error = document.getElementById('error');
      results.innerHTML = '';
      error.hidden = true;

      const names = input.split(/[\n,;]+/u).map(normalizeName).filter(Boolean);
      const unique = [...new Set(names)];

      if (!unique.length) {
        error.textContent = 'Не удалось найти имена. Попробуйте ввести хотя бы одно имя.';
        error.hidden = false;
        return;
      }

      unique.forEach((name) => {
        const card = document.createElement('div');
        card.className = 'greeting';
        const title = document.createElement('div');
        title.className = 'name';
        title.textContent = `Для ${name}:`;
        const text = document.createElement('div');
        text.textContent = greetingFor(name, holiday);
        card.appendChild(title);
        card.appendChild(text);
        results.appendChild(card);
      });
    });
  </script>
</body>
</html>
